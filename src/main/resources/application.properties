spring.application.name=event-registration-api
server.port=8080

# Custom settings, read in RegistrationController with @Value
app.course=Web Technologies
app.semester=3

# Pretty-print JSON so it is easy to read in the browser
spring.jackson.serialization.indent-output=true

# --- Lab 8: PostgreSQL ---
# Credentials are NOT stored here. They come from environment variables DB_USER / DB_PASSWORD
# (IDE run configuration or terminal), or from an untracked application-local.properties
# file next to build.gradle (see application-local.properties.example).
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/event_db}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Hibernate creates/updates the "events" table from the Event entity.
# Fine for a local development database only, never for production.
spring.jpa.hibernate.ddl-auto=update
# Print the SQL that Hibernate sends, handy for the demo
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
